﻿<p><b>考点</b>：微分方程建立+旋转体体积+分离变量法</p>
<p><b>题意</b>：f(x)在[0,+∞)单调增加、连续可导、f(0)=1。直线x=0,x=t,y=f(x)及x轴围成曲边梯形绕x轴旋转，体积V(t)满足某关系式，求f(x)。</p>
<p><b>错因</b>：旋转体体积公式π∫f²dx列不出微分方程；分离变量后积分出错。</p>
<p><b>复习</b>：回忆"由几何条件列微分方程"题型，π∫f²dx与∫f(x)dx的关系。</p>
