<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>你画我猜 · 双人联机</title>
<style>
  :root {
    --bg: #f2f7fb; --surface: #ffffff; --border: #dce8f2;
    --text: #2f3644; --dim: #68707d; --bright: #0b1220;
    --blue: #0284c7; --blue-bg: #e0f2fe; --green: #16a34a; --green-bg: #ecfdf3;
    --red: #dc2626; --red-bg: #fef1f1; --yellow-bg: #fdf6e0; --yellow: #b97e06;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px 12px 44px; }
  h1 { font-size: 20px; color: var(--bright); text-align: center; }
  .subtitle { text-align: center; color: var(--dim); font-size: 12.5px; margin: 4px 0 14px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .panel h3 { font-size: 14.5px; color: var(--bright); margin-bottom: 6px; }
  .hint { font-size: 12px; color: var(--dim); line-height: 1.6; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  button { border: 1px solid var(--blue); background: var(--blue); color: #fff; font-size: 13.5px; font-weight: 700; padding: 9px 16px; border-radius: 11px; cursor: pointer; font-family: inherit; }
  button.secondary { background: var(--surface); color: var(--text); border-color: var(--border); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  input[type="text"] { border: 1px solid var(--border); border-radius: 11px; padding: 9px 12px; font-size: 14px; outline: none; width: 100%; color: var(--bright); background: var(--surface); }
  input[type="text"]:focus { border-color: var(--blue); }
  .banner { display: none; border-radius: 12px; padding: 10px 13px; font-size: 13px; margin-bottom: 10px; line-height: 1.6; }
  .banner.show { display: block; }
  .banner.error { background: var(--red-bg); color: var(--red); }
  .banner.info { background: var(--blue-bg); color: var(--blue); }
  .banner.success { background: var(--green-bg); color: var(--green); }
  .room-code { font-size: 24px; font-weight: 800; letter-spacing: 1.5px; color: var(--bright); text-align: center; padding: 6px 0 2px; font-variant-numeric: tabular-nums; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
  .chip { font-size: 11.5px; padding: 3px 10px; border-radius: 99px; background: #eef4fa; color: var(--dim); }
  .chip.on { background: var(--green-bg); color: var(--green); font-weight: 700; }
  .chip.off { background: var(--red-bg); color: var(--red); }
  .scorebar { display: flex; gap: 10px; }
  .score { flex: 1; text-align: center; background: #f6fafd; border: 1px solid var(--border); border-radius: 13px; padding: 8px 4px; }
  .score .who { font-size: 11.5px; color: var(--dim); }
  .score .pts { font-size: 21px; font-weight: 800; color: var(--bright); line-height: 1.2; }
  .score.me { border-color: var(--blue); background: var(--blue-bg); }
  .roundline { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
  .round-badge { font-size: 12px; font-weight: 700; color: var(--blue); background: var(--blue-bg); padding: 3px 11px; border-radius: 99px; white-space: nowrap; }
  .timer { margin-left: auto; font-size: 19px; font-weight: 800; color: var(--bright); font-variant-numeric: tabular-nums; }
  .timer.low { color: var(--red); }
  .wordcard { text-align: center; background: var(--yellow-bg); border-radius: 13px; padding: 11px; margin-bottom: 10px; }
  .wordcard .w { font-size: 22px; font-weight: 800; color: var(--bright); letter-spacing: 3px; }
  .wordcard .c { font-size: 12px; color: var(--yellow); }
  .blanks { text-align: center; font-size: 21px; letter-spacing: 5px; color: var(--bright); font-weight: 700; padding: 8px 0 2px; }
  .canvas-box { position: relative; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: #fff; }
  canvas { display: block; width: 100%; aspect-ratio: 4 / 3; touch-action: none; }
  .tools { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
  .swatch { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid transparent; cursor: pointer; padding: 0; }
  .swatch.active { border-color: var(--bright); transform: scale(1.12); }
  .size-btn { border: 1px solid var(--border); background: var(--surface); color: var(--dim); border-radius: 99px; padding: 4px 11px; font-size: 12px; font-weight: 600; }
  .size-btn.active { background: var(--blue-bg); color: var(--blue); border-color: var(--blue); }
  .tool-btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 99px; padding: 5px 13px; font-size: 12.5px; font-weight: 600; margin-left: auto; }
  .feed { max-height: 168px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; margin-top: 4px; }
  .feed .g { font-size: 13px; background: #f6fafd; border-radius: 9px; padding: 5px 10px; }
  .feed .g.right { background: var(--green-bg); color: var(--green); font-weight: 700; }
  .feed .g .who { color: var(--dim); font-size: 11.5px; margin-right: 5px; }
  .guess-row { display: flex; gap: 8px; margin-top: 10px; }
  .guess-row input { flex: 1; }
  .guess-row button { white-space: nowrap; }
  .big-result { text-align: center; font-size: 19px; font-weight: 800; color: var(--bright); padding: 8px 0 2px; }
  .verdict { text-align: center; color: var(--dim); font-size: 13px; line-height: 1.7; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>你画我猜</h1>
  <p class="subtitle">双人异地联机 · 轮流画、轮流猜，看看你们的默契能得多少分</p>

  <!-- 入口 -->
  <div id="landingSection">
    <div class="panel">
      <h3>我是房主（玩家 A）</h3>
      <p class="hint">创建房间后，把房间码发给对方。你的手机负责主持对局，请保持本页打开。</p>
      <div class="btn-row"><button type="button" id="createBtn">创建房间</button></div>
    </div>
    <div class="panel">
      <h3>我是玩家 B</h3>
      <p class="hint">输入房主给你的房间码加入。</p>
      <div class="guess-row" style="margin-top:8px">
        <input type="text" id="joinCode" placeholder="房间码，如 E-XXXX-XXXX-XXXX" autocomplete="off">
        <button type="button" id="joinBtn">加入房间</button>
      </div>
    </div>
    <div class="banner error" id="landingError" role="alert"></div>
    <div class="banner info" id="landingInfo" role="status"></div>
    <p class="hint">两部手机打开同一个本页面即可，不需要在同一网络。刷新页面会自动恢复对局；只有点「清空本页并退出」才会真正清局。</p>
  </div>

  <!-- 房间与对局 -->
  <div id="roomSection" hidden>
    <div class="panel" style="padding-bottom:10px">
      <div class="room-code" id="roomCodeText">—</div>
      <div class="chips">
        <span class="chip" id="roleChip">角色：—</span>
        <span class="chip off" id="connChip">连接：未连接</span>
        <span class="chip off" id="peerChip">对方：未加入</span>
      </div>
      <div class="btn-row" style="justify-content:center">
        <button type="button" class="secondary" id="copyBtn">复制房间码</button>
        <button type="button" class="secondary" id="leaveBtn">清空本页并退出</button>
      </div>
    </div>

    <div class="banner error" id="gameError" role="alert"></div>
    <div class="banner info" id="gameInfo" role="status"></div>
    <div class="banner success" id="noticeBanner" role="status"></div>

    <div class="panel">
      <div class="scorebar">
        <div class="score" id="scoreA"><div class="who">玩家 A</div><div class="pts">0</div></div>
        <div class="score" id="scoreB"><div class="who">玩家 B</div><div class="pts">0</div></div>
      </div>
      <div class="roundline">
        <span class="round-badge" id="roundBadge">等待开始</span>
        <span class="timer" id="timerText"></span>
      </div>

      <div class="wordcard" id="wordCard" hidden>
        <div class="c" id="wordCat"></div>
        <div class="w" id="wordText"></div>
        <div class="hint" id="wordHint"></div>
      </div>
      <div class="blanks" id="blanksBox" hidden></div>

      <div class="canvas-box"><canvas id="board" width="1000" height="750"></canvas></div>

      <div class="tools" id="toolsBar" hidden>
        <span id="swatches"></span>
        <button type="button" class="size-btn" data-size="6">细</button>
        <button type="button" class="size-btn active" data-size="12">中</button>
        <button type="button" class="size-btn" data-size="22">粗</button>
        <button type="button" class="tool-btn" id="clearBtn">清空画布</button>
        <button type="button" class="tool-btn" id="skipBtn" style="margin-left:0">换一题</button>
      </div>

      <div class="btn-row" id="hostStartRow" hidden>
        <button type="button" id="startBtn">开始游戏</button>
      </div>
      <div class="btn-row" id="nextRow" hidden>
        <button type="button" id="nextBtn">下一轮</button>
      </div>
      <div class="btn-row" id="againRow" hidden>
        <button type="button" id="againBtn">再来一局</button>
      </div>

      <div class="big-result" id="resultText" hidden></div>
      <div class="verdict" id="verdictText" hidden></div>
    </div>

    <div class="panel" id="guessPanel">
      <h3>猜词区</h3>
      <div class="feed" id="feedBox"><p class="hint">还没有猜测记录。</p></div>
      <form class="guess-row" id="guessForm">
        <input type="text" id="guessInput" placeholder="输入你猜的词，回车发送" autocomplete="off" maxlength="12">
        <button type="submit" id="guessBtn">猜！</button>
      </form>
      <p class="hint" id="guessHint">轮到你猜时在这里输入；你画画时这里会显示对方的猜测。</p>
    </div>
  </div>
</div>

<script>
"use strict";
/* ================= 词库 ================= */
var WORD_BANK = [
  ["西瓜","食物"],["火锅","食物"],["奶茶","食物"],["蛋糕","食物"],["饺子","食物"],["冰淇淋","食物"],["汉堡","食物"],["螺蛳粉","食物"],["烤鸭","食物"],["草莓","食物"],
  ["猫","动物"],["狗","动物"],["熊猫","动物"],["兔子","动物"],["企鹅","动物"],["长颈鹿","动物"],["大象","动物"],["青蛙","动物"],["蝴蝶","动物"],["鲨鱼","动物"],
  ["手机","日常"],["雨伞","日常"],["眼镜","日常"],["自行车","日常"],["电脑","日常"],["闹钟","日常"],["钥匙","日常"],["背包","日常"],["牙刷","日常"],["沙发","日常"],
  ["游泳","动作"],["唱歌","动作"],["跳舞","动作"],["跑步","动作"],["睡觉","动作"],["做饭","动作"],["拍照","动作"],["拥抱","动作"],["钓鱼","动作"],["滑雪","动作"],
  ["月亮","自然与地点"],["太阳","自然与地点"],["大海","自然与地点"],["雪山","自然与地点"],["彩虹","自然与地点"],["公园","自然与地点"],["学校","自然与地点"],["电影院","自然与地点"],["火车站","自然与地点"],["灯塔","自然与地点"],
  ["牵手","情侣日常"],["约会","情侣日常"],["礼物","情侣日常"],["玫瑰","情侣日常"],["爱心","情侣日常"],["情书","情侣日常"],["晚安","情侣日常"],["合照","情侣日常"],["看电影","情侣日常"],["散步","情侣日常"]
];
var TOTAL_ROUNDS = 10;
var ROUND_SECONDS = 90;

/* ================= 房主权威对局核心（DOM 无关） ================= */
function createCore(saved) {
  var S = saved || null;
  var state = {
    phase: "lobby",            // lobby | drawing | reveal | over
    round: 0,
    drawer: "a",
    word: "", cat: "",
    endsAt: 0,
    scores: { a: 0, b: 0 },
    feed: [],                  // {who, text, right}
    guessed: 0,                // 已猜对的轮数
    deck: [], deckIdx: 0,
    skipped: false,
    lastRound: null,           // {word, cat, drawer, result: 'right'|'timeout', pts:{guesser,drawer}}
    notice: "",
    peerIn: false
  };
  if (S) { for (var k in S) state[k] = S[k]; }
  function shuffleDeck() {
    var idx = WORD_BANK.map(function (_, i) { return i; });
    for (var i = idx.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
    state.deck = idx; state.deckIdx = 0;
  }
  if (!state.deck.length) shuffleDeck();
  function drawWord() {
    if (state.deckIdx >= state.deck.length) shuffleDeck();
    var w = WORD_BANK[state.deck[state.deckIdx++]];
    state.word = w[0]; state.cat = w[1];
  }
  function startGame() {
    if (state.phase !== "lobby" && state.phase !== "over") return;
    state.scores = { a: 0, b: 0 }; state.guessed = 0; state.round = 0;
    shuffleDeck();
    nextRound();
  }
  function nextRound() {
    if (state.round >= TOTAL_ROUNDS) { state.phase = "over"; return; }
    state.round += 1;
    state.drawer = state.round % 2 === 1 ? "a" : "b";
    state.feed = []; state.skipped = false;
    drawWord();
    state.endsAt = Date.now() + ROUND_SECONDS * 1000;
    state.phase = "drawing";
    state.notice = "";
  }
  function endRound(result) {
    var guesser = state.drawer === "a" ? "b" : "a";
    var pts = { guesser: 0, drawer: 0 };
    if (result === "right") {
      var left = Math.max(0, Math.round((state.endsAt - Date.now()) / 1000));
      pts.guesser = 50 + left;
      pts.drawer = 30;
      state.scores[guesser] += pts.guesser;
      state.scores[state.drawer] += pts.drawer;
      state.guessed += 1;
    }
    state.lastRound = { word: state.word, cat: state.cat, drawer: state.drawer, result: result, pts: pts, guesser: guesser };
    state.phase = "reveal";
  }
  function tick() {
    if (state.phase === "drawing" && Date.now() >= state.endsAt) { endRound("timeout"); return true; }
    return false;
  }
  function guess(player, text) {
    if (state.phase !== "drawing") return false;
    if (player === state.drawer) return false;
    var t = String(text || "").trim();
    if (!t) return false;
    var right = t === state.word;
    state.feed.push({ who: player, text: t, right: right });
    if (state.feed.length > 40) state.feed = state.feed.slice(-40);
    if (right) endRound("right");
    return true;
  }
  function skip(player) {
    if (state.phase !== "drawing" || player !== state.drawer || state.skipped) return false;
    state.skipped = true;
    drawWord();
    state.notice = "画手换了一题（本轮只能换一次）";
    return true;
  }
  function viewFor(player) {
    var isDrawer = player === state.drawer;
    return {
      phase: state.phase, round: state.round, totalRounds: TOTAL_ROUNDS,
      drawer: state.drawer, scores: state.scores, feed: state.feed,
      guessed: state.guessed, notice: state.notice, peerIn: state.peerIn,
      cat: state.cat, wordLen: state.word ? state.word.length : 0,
      endsAt: state.endsAt, lastRound: state.lastRound,
      myWord: (state.phase === "drawing" && isDrawer) ? state.word : "",
      revealWord: state.phase === "reveal" || state.phase === "over" ? (state.lastRound ? state.lastRound.word : "") : ""
    };
  }
  return {
    state: state, startGame: startGame, nextRound: nextRound, guess: guess, skip: skip, tick: tick,
    guestJoin: function () { state.peerIn = true; },
    guestLeave: function () { state.peerIn = false; },
    viewFor: viewFor,
    serialize: function () { var c = {}; for (var k in state) c[k] = state[k]; return c; }
  };
}


/* ================= 极简 MQTT 客户端（原生 WebSocket，无外部库） =================
 * 只实现本游戏用到的 MQTT 3.1.1 子集：CONNECT / SUBSCRIBE / PUBLISH(QoS0, retain)
 * / PINGREQ / DISCONNECT，含遗嘱（Last Will）与自动重连。
 */
/* 只保留实测可用的公共通道：备用通道（HiveMQ / ConnectMQ / Mosquitto）
 * 经同一客户端实测无法完成连接，故不启用，避免建房后对方连不进来。 */
var BROKERS = [
  { id: "E", label: "EMQX",    url: "wss://broker.emqx.io:8084/mqtt" }
];
function brokerById(id) { for (var i = 0; i < BROKERS.length; i++) if (BROKERS[i].id === id) return BROKERS[i]; return null; }

function mqttEncodeString(s) {
  var bytes = new TextEncoder().encode(s);
  var out = new Uint8Array(2 + bytes.length);
  out[0] = (bytes.length >> 8) & 0xff; out[1] = bytes.length & 0xff;
  out.set(bytes, 2);
  return out;
}
function mqttEncodeLength(len) {
  var out = [];
  do { var b = len % 128; len = Math.floor(len / 128); if (len > 0) b |= 0x80; out.push(b); } while (len > 0);
  return new Uint8Array(out);
}
function mqttPacket(typeAndFlags, bodyParts) {
  var bodyLen = 0, i;
  for (i = 0; i < bodyParts.length; i++) bodyLen += bodyParts[i].length;
  var head = mqttEncodeLength(bodyLen);
  var packet = new Uint8Array(1 + head.length + bodyLen);
  packet[0] = typeAndFlags; packet.set(head, 1);
  var off = 1 + head.length;
  for (i = 0; i < bodyParts.length; i++) { packet.set(bodyParts[i], off); off += bodyParts[i].length; }
  return packet;
}

/* === MQTT client === */
function MqttClient(url, clientId, will) {
  this.url = url; this.clientId = clientId; this.will = will || null;
  this.ws = null; this.connected = false; this.intentionalClose = false;
  this.buffer = new Uint8Array(0); this.packetId = 1; this.pingTimer = null; this.reconnectTimer = null;
  this.subscriptions = [];
  this.onConnect = null; this.onMessage = null; this.onStatus = null;
}
MqttClient.prototype._status = function (s) { if (this.onStatus) this.onStatus(s); };
MqttClient.prototype.connect = function () {
  var self = this;
  this.intentionalClose = false;
  this._status("connecting");
  var ws;
  try { ws = new WebSocket(this.url, "mqtt"); } catch (e) { this._scheduleReconnect(); return; }
  this.ws = ws; ws.binaryType = "arraybuffer";
  ws.onopen = function () { self._sendConnect(); };
  ws.onmessage = function (ev) { self._onData(new Uint8Array(ev.data)); };
  ws.onclose = function () {
    self.connected = false; self._stopPing(); self._status("closed");
    if (!self.intentionalClose) self._scheduleReconnect();
  };
  ws.onerror = function () { try { ws.close(); } catch (e) {} };
};
MqttClient.prototype._scheduleReconnect = function () {
  var self = this;
  if (this.reconnectTimer || this.intentionalClose) return;
  this._status("reconnecting");
  this.reconnectTimer = setTimeout(function () { self.reconnectTimer = null; self.connect(); }, 3000);
};
MqttClient.prototype._sendConnect = function () {
  var flags = 0x02; // clean session
  var parts = [mqttEncodeString("MQTT"), new Uint8Array([4, 0, 0, 60]), mqttEncodeString(this.clientId)];
  if (this.will) {
    flags |= 0x04 | 0x20; // will flag + will retain (QoS 0)
    parts[1][1] = flags;
    parts.push(mqttEncodeString(this.will.topic));
    parts.push(mqttEncodeString(this.will.payload));
  } else { parts[1][1] = flags; }
  // keepalive bytes are parts[1][2..3] = 0,60 已设置
  this.ws.send(mqttPacket(0x10, parts));
};
MqttClient.prototype._onConnack = function () {
  var self = this;
  this.connected = true; this._status("online");
  for (var i = 0; i < this.subscriptions.length; i++) this._sendSubscribe(this.subscriptions[i]);
  this._stopPing();
  this.pingTimer = setInterval(function () {
    if (self.ws && self.ws.readyState === 1) self.ws.send(new Uint8Array([0xc0, 0x00]));
  }, 30000);
  if (this.onConnect) this.onConnect();
};
MqttClient.prototype._stopPing = function () { if (this.pingTimer) { clearInterval(this.pingTimer); this.pingTimer = null; } };
MqttClient.prototype.subscribe = function (topic) {
  if (this.subscriptions.indexOf(topic) < 0) this.subscriptions.push(topic);
  if (this.connected) this._sendSubscribe(topic);
};
MqttClient.prototype._sendSubscribe = function (topic) {
  var id = this.packetId++ & 0xffff; if (id === 0) id = this.packetId++ & 0xffff;
  var body = [new Uint8Array([(id >> 8) & 0xff, id & 0xff]), mqttEncodeString(topic), new Uint8Array([0])];
  this.ws.send(mqttPacket(0x82, body));
};
MqttClient.prototype.publish = function (topic, payload, retain) {
  if (!this.connected || !this.ws || this.ws.readyState !== 1) return false;
  var body = [mqttEncodeString(topic), new TextEncoder().encode(payload)];
  this.ws.send(mqttPacket(retain ? 0x31 : 0x30, body));
  return true;
};
MqttClient.prototype._onData = function (chunk) {
  var merged = new Uint8Array(this.buffer.length + chunk.length);
  merged.set(this.buffer); merged.set(chunk, this.buffer.length);
  this.buffer = merged;
  while (true) {
    if (this.buffer.length < 2) return;
    var multiplier = 1, remaining = 0, idx = 1, digit;
    do {
      if (idx >= this.buffer.length) return;
      digit = this.buffer[idx++]; remaining += (digit & 0x7f) * multiplier; multiplier *= 128;
    } while ((digit & 0x80) !== 0);
    if (this.buffer.length < idx + remaining) return;
    var packet = this.buffer.slice(idx, idx + remaining);
    var type = this.buffer[0] >> 4;
    this.buffer = this.buffer.slice(idx + remaining);
    this._handlePacket(type, packet);
  }
};
MqttClient.prototype._handlePacket = function (type, body) {
  if (type === 2) { this._onConnack(); return; }           // CONNACK
  if (type === 3) {                                          // PUBLISH
    var tlen = (body[0] << 8) | body[1];
    var topic = new TextDecoder().decode(body.slice(2, 2 + tlen));
    var payload = body.slice(2 + tlen);
    if (this.onMessage) this.onMessage(topic, new TextDecoder().decode(payload));
    return;
  }
  // SUBACK / PINGRESP 等忽略
};
MqttClient.prototype.close = function () {
  this.intentionalClose = true;
  if (this.reconnectTimer) { clearTimeout(this.reconnectTimer); this.reconnectTimer = null; }
  this._stopPing();
  if (this.ws) { try { this.ws.send(new Uint8Array([0xe0, 0x00])); this.ws.close(); } catch (e) {} }
  this.connected = false;
};
/* === End MQTT client === */


/* ================= 双端联机 glue + 画布 + 渲染 ================= */
function $(id) { return document.getElementById(id); }
function escapeHtml(str) {
  return String(str == null ? "" : str).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function showBanner(el, text, kind) {
  el.textContent = text || "";
  el.className = "banner" + (text ? " show " + (kind || "info") : "");
}

var SESSION_KEY = "drawguess-v1-session";
var memoryStore = null;
function storeSave(obj) {
  memoryStore = obj;
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(obj)); } catch (e) {}
  try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(obj)); } catch (e) {}
}
function storeLoad() {
  try { var v = localStorage.getItem(SESSION_KEY); if (v) return JSON.parse(v); } catch (e) {}
  try { var v2 = sessionStorage.getItem(SESSION_KEY); if (v2) return JSON.parse(v2); } catch (e) {}
  return memoryStore;
}
function storeClear() {
  memoryStore = null;
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
}
function saveSession() {
  if (!role || !rawCode) return;
  if (role === "a" && core) storeSave({ role: "a", rawCode: rawCode, core: core.serialize() });
  else if (role === "b") storeSave({ role: "b", rawCode: rawCode, view: guestView });
}

var CODE_ALPHABET = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function genRawCode(brokerId) {
  var rand = new Uint8Array(12);
  if ((window.crypto || {}).getRandomValues) crypto.getRandomValues(rand);
  else rand.forEach(function (v, i) { rand[i] = Math.floor(Math.random() * 256); });
  var out = brokerId;
  for (var i = 0; i < 12; i++) out += CODE_ALPHABET[rand[i] % CODE_ALPHABET.length];
  return out;
}
function formatCode(raw) { return raw.slice(0, 1) + "-" + raw.slice(1, 5) + "-" + raw.slice(5, 9) + "-" + raw.slice(9, 13); }
function parseCode(input) {
  var raw = String(input || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (raw.length !== 13 || !brokerById(raw[0])) return null;
  return raw;
}

var role = null, core = null, client = null;
var rawCode = "", topicBase = "", broker = null;
var peerOnline = false, hostOnline = false, guestView = null;
var clearGen = 0;         // 画布清空代数：跨刷新/重连时避免旧笔迹回放
var lastPhaseKey = "";

function topics() {
  return { state: topicBase + "/state", action: topicBase + "/action",
           peer: topicBase + "/peer-b", draw: topicBase + "/draw" };
}
function clientId(prefix) {
  return "dg-" + prefix + "-" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}
function probeBroker(b, done) {
  var c = new MqttClient(b.url, clientId("probe"), null);
  var finished = false;
  var timer = setTimeout(function () { if (!finished) { finished = true; c.close(); done(false); } }, 8000);
  c.onConnect = function () { if (!finished) { finished = true; clearTimeout(timer); c.close(); done(true); } };
  c.connect();
}
function currentView() {
  if (role === "a" && core) return core.viewFor("a");
  if (role === "b") return guestView;
  return null;
}
function amDrawer(view) { return view && view.drawer === role; }
function afterCoreChange() {
  if (role === "a" && core && client) {
    client.publish(topics().state, JSON.stringify({ type: "view", view: core.viewFor("b"), clearGen: clearGen, ts: Date.now() }), true);
  }
  saveSession();
  render();
}

function connectHost(b, code, coreInstance) {
  broker = b; rawCode = code;
  topicBase = "keyaluck/drawguess/v1/" + rawCode;
  role = "a"; core = coreInstance;
  client = new MqttClient(b.url, clientId("host"), {
    topic: topics().state, payload: JSON.stringify({ type: "host-offline" })
  });
  wireStatus();
  client.onConnect = function () {
    client.subscribe(topics().action);
    client.subscribe(topics().peer);
    client.subscribe(topics().draw);
    afterCoreChange();
  };
  client.onMessage = function (topic, payload) {
    var msg; try { msg = JSON.parse(payload); } catch (e) { return; }
    if (topic === topics().peer) {
      peerOnline = !!msg.online;
      if (msg.online) core.guestJoin(); else core.guestLeave();
      afterCoreChange(); return;
    }
    if (topic === topics().draw) { onDrawMessage(msg, "a"); return; }
    if (topic === topics().action) {
      if (msg.type === "join") core.guestJoin();
      else if (msg.type === "start") { /* 开始仅房主本地触发，忽略远程 */ }
      else if (msg.type === "guess") core.guess("b", msg.text || "");
      else if (msg.type === "skip") core.skip("b");
      else if (msg.type === "next") { if (core.state.phase === "reveal") core.nextRound(); }
      else if (msg.type === "again") { if (core.state.phase === "over") core.startGame(); }
      else if (msg.type === "clear") { /* 清空由 draw 通道同步 */ }
      afterCoreChange();
    }
  };
  client.connect();
  saveSession();
  render();
  startHostLoops();
}

function startHost() {
  showBanner($("landingError"), "", "error");
  showBanner($("landingInfo"), "正在连接联机通道…", "info");
  $("createBtn").disabled = true;
  var idx = 0;
  (function tryNext() {
    if (idx >= BROKERS.length) {
      showBanner($("landingInfo"), "", "info");
      showBanner($("landingError"), "联机通道暂时连接不上，请检查网络后重试。", "error");
      $("createBtn").disabled = false;
      return;
    }
    var b = BROKERS[idx++];
    probeBroker(b, function (ok) {
      if (!ok) { tryNext(); return; }
      connectHost(b, genRawCode(b.id), createCore(null));
    });
  })();
}

function restoreHost(saved) {
  var b = brokerById(saved.rawCode[0]);
  if (!b) { storeClear(); return; }
  showBanner($("landingInfo"), "正在恢复上次对局…", "info");
  probeBroker(b, function (ok) {
    if (!ok) {
      showBanner($("landingError"), "联机通道暂时连接不上，上次对局已保留在本机，稍后刷新页面会再次恢复。", "error");
      return;
    }
    connectHost(b, saved.rawCode, createCore(saved.core));
  });
}

function startGuest(raw, restoredView) {
  rawCode = raw; broker = brokerById(raw[0]);
  topicBase = "keyaluck/drawguess/v1/" + rawCode;
  role = "b"; hostOnline = false; guestView = restoredView || null;
  client = new MqttClient(broker.url, clientId("guest"), {
    topic: topics().peer, payload: JSON.stringify({ online: false })
  });
  wireStatus();
  client.onConnect = function () {
    client.subscribe(topics().state);
    client.subscribe(topics().draw);
    client.publish(topics().peer, JSON.stringify({ online: true, ts: Date.now() }), true);
    client.publish(topics().action, JSON.stringify({ type: "join" }), false);
    render();
  };
  client.onMessage = function (topic, payload) {
    var msg; try { msg = JSON.parse(payload); } catch (e) { return; }
    if (topic === topics().draw) { onDrawMessage(msg, "b"); return; }
    if (topic !== topics().state) return;
    if (msg.type === "host-offline") { hostOnline = false; render(); return; }
    if (msg.type === "room-closed") {
      storeClear();
      if (client) client.close();
      role = null; guestView = null;
      document.location.reload();
      return;
    }
    if (msg.type === "view") {
      hostOnline = true;
      var prev = guestView;
      guestView = msg.view;
      if (typeof msg.clearGen === "number" && msg.clearGen !== clearGen) {
        clearGen = msg.clearGen;
        wipeCanvas();
      }
      if (prev && prev.phase !== "drawing" && guestView.phase === "drawing") wipeCanvas();
      saveSession();
      render();
    }
  };
  client.connect();
  saveSession();
  render();
}

function wireStatus() {
  client.onStatus = function (s) {
    var chip = $("connChip");
    var map = { connecting: "连接：连接中…", online: "连接：已连接 · " + (broker ? broker.label : ""),
                closed: "连接：已断开", reconnecting: "连接：重连中…" };
    chip.textContent = map[s] || ("连接：" + s);
    chip.className = "chip " + (s === "online" ? "on" : "off");
  };
}
function sendAction(msg) { if (client) client.publish(topics().action, JSON.stringify(msg), false); }

/* 房主秒级循环：超时判定 + 视图心跳（让 B 端倒计时平滑、掉线可恢复） */
var hostLoopsStarted = false;
function startHostLoops() {
  if (hostLoopsStarted) return;
  hostLoopsStarted = true;
  setInterval(function () {
    if (role !== "a" || !core) return;
    if (core.tick()) afterCoreChange();
  }, 500);
}

/* ================= 画布与笔迹同步 ================= */
var canvas = $("board"), ctx = canvas.getContext("2d");
var COLORS = ["#111827", "#dc2626", "#f97316", "#eab308", "#16a34a", "#0284c7", "#7c3aed"];
var pen = { color: COLORS[0], width: 12 };
var strokeSeq = 0, curStroke = null, pendingPts = [], flushTimer = null;
var remoteStrokes = {};   // id -> {color, width, last:[x,y], active}
var myClearGen = 0;

function wipeCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); remoteStrokes = {}; }
function drawSeg(x1, y1, x2, y2, color, width) {
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function drawDot(x, y, color, width) {
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, width / 2, 0, Math.PI * 2); ctx.fill();
}
function publishDraw(msg) { if (client) client.publish(topics().draw, JSON.stringify(msg), false); }
function onDrawMessage(msg, myRole) {
  var view = currentView();
  if (!view || view.phase !== "drawing") return;
  if (msg.from === myRole) return;                     // 自己发的笔迹本地已画
  if (msg.t === "clear") { if (msg.gen >= clearGen) { clearGen = msg.gen; wipeCanvas(); } return; }
  if (typeof msg.gen === "number" && msg.gen !== clearGen) return;  // 旧代数笔迹丢弃
  if (msg.t === "begin") {
    remoteStrokes[msg.id] = { color: msg.color, width: msg.w, last: null, active: true };
  } else if (msg.t === "pts") {
    var st = remoteStrokes[msg.id];
    if (!st) { st = remoteStrokes[msg.id] = { color: pen.color, width: 12, last: null, active: true }; }
    for (var i = 0; i < msg.pts.length; i++) {
      var p = msg.pts[i];
      if (st.last) drawSeg(st.last[0], st.last[1], p[0], p[1], st.color, st.width);
      else drawDot(p[0], p[1], st.color, st.width);
      st.last = p;
    }
  } else if (msg.t === "end") {
    if (remoteStrokes[msg.id]) remoteStrokes[msg.id].active = false;
  }
}
function canvasPos(e) {
  var r = canvas.getBoundingClientRect();
  var x = (e.clientX - r.left) / r.width * canvas.width;
  var y = (e.clientY - r.top) / r.height * canvas.height;
  return [Math.round(x), Math.round(y)];
}
function flushPts() {
  if (!curStroke || !pendingPts.length) return;
  publishDraw({ t: "pts", id: curStroke, gen: clearGen, from: role, pts: pendingPts });
  pendingPts = [];
}
canvas.addEventListener("pointerdown", function (e) {
  var view = currentView();
  if (!view || view.phase !== "drawing" || !amDrawer(view)) return;
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  curStroke = role + "-" + (++strokeSeq) + "-" + Date.now().toString(36);
  var p = canvasPos(e);
  drawDot(p[0], p[1], pen.color, pen.width);
  publishDraw({ t: "begin", id: curStroke, gen: clearGen, from: role, color: pen.color, w: pen.width });
  publishDraw({ t: "pts", id: curStroke, gen: clearGen, from: role, pts: [p] });
  curStrokeLast = p;
  if (!flushTimer) flushTimer = setInterval(flushPts, 70);
});
var curStrokeLast = null;
canvas.addEventListener("pointermove", function (e) {
  if (!curStroke) return;
  var p = canvasPos(e);
  if (curStrokeLast) drawSeg(curStrokeLast[0], curStrokeLast[1], p[0], p[1], pen.color, pen.width);
  curStrokeLast = p;
  pendingPts.push(p);
  if (pendingPts.length >= 14) flushPts();
});
function endStroke() {
  if (!curStroke) return;
  flushPts();
  publishDraw({ t: "end", id: curStroke, gen: clearGen, from: role });
  curStroke = null; curStrokeLast = null;
  if (flushTimer) { clearInterval(flushTimer); flushTimer = null; }
}
canvas.addEventListener("pointerup", endStroke);
canvas.addEventListener("pointercancel", endStroke);

$("clearBtn").addEventListener("click", function () {
  var view = currentView();
  if (!view || view.phase !== "drawing" || !amDrawer(view)) return;
  clearGen += 1;
  wipeCanvas();
  publishDraw({ t: "clear", gen: clearGen, from: role });
  if (role === "a") afterCoreChange();
});
$("skipBtn").addEventListener("click", function () {
  var view = currentView();
  if (!view || !amDrawer(view)) return;
  if (role === "a") { if (core.skip("a")) { clearGen += 1; wipeCanvas(); publishDraw({ t: "clear", gen: clearGen, from: role }); afterCoreChange(); } }
  else { clearGen += 1; wipeCanvas(); publishDraw({ t: "clear", gen: clearGen, from: role }); sendAction({ type: "skip" }); }
});

/* 颜色与粗细 */

  if (me === "b" && !hostOnline) info = "房主当前不在线，等对方回到页面后自动继续。";
  showBanner($("gameInfo"), info, "info");
  showBanner($("noticeBanner"), view.notice && view.phase === "drawing" ? view.notice : "", "success");
  showBanner($("gameError"), "", "error");
  updateTimer(view);
}

function updateTimer(view) {
  var t = $("timerText");
  if (!view || view.phase !== "drawing") { t.textContent = ""; t.className = "timer"; return; }
  var left = Math.max(0, Math.round((view.endsAt - Date.now()) / 1000));
  t.textContent = left + "s";
  t.className = "timer" + (left <= 15 ? " low" : "");
}
setInterval(function () { var v = currentView(); if (v) updateTimer(v); }, 250);

/* ================= 按钮与表单 ================= */
$("createBtn").addEventListener("click", startHost);
$("joinBtn").addEventListener("click", function () {
  var raw = parseCode($("joinCode").value);
  if (!raw) { showBanner($("landingError"), "房间码格式不对，请检查后重新输入。", "error"); return; }
  showBanner($("landingError"), "", "error");
  startGuest(raw, null);
});
$("startBtn").addEventListener("click", function () {
  if (role === "a" && core) { core.startGame(); clearGen += 1; wipeCanvas(); afterCoreChange(); }
});
$("nextBtn").addEventListener("click", function () {
  if (role === "a" && core) { if (core.state.phase === "reveal") { core.nextRound(); clearGen += 1; wipeCanvas(); afterCoreChange(); } }
  else sendAction({ type: "next" });
});
$("againBtn").addEventListener("click", function () {
  if (role === "a" && core) { core.startGame(); clearGen += 1; wipeCanvas(); afterCoreChange(); }
  else sendAction({ type: "again" });
});
$("guessForm").addEventListener("submit", function (e) {
  e.preventDefault();
  var input = $("guessInput");
  var text = input.value.trim();
  if (!text) return;
  input.value = "";
  if (role === "a" && core) { if (core.guess("a", text)) afterCoreChange(); }
  else sendAction({ type: "guess", text: text });
});
$("copyBtn").addEventListener("click", function () {
  var text = formatCode(rawCode);
  function done() { $("copyBtn").textContent = "已复制"; setTimeout(function () { $("copyBtn").textContent = "复制房间码"; }, 1500); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, done);
  else done();
});
$("leaveBtn").addEventListener("click", function () {
  if (!confirm("确定要清空本页并退出吗？本局将结束，双方都要重新建房/加入。")) return;
  if (!confirm("再确认一次：清空后无法恢复本局。")) return;
  if (role === "a" && client) client.publish(topics().state, JSON.stringify({ type: "room-closed" }), true);
  storeClear();
  if (client) client.close();
  document.location.reload();
});

/* ================= 启动：恢复会话或显示入口 ================= */
(function boot() {
  var saved = storeLoad();
  if (saved && saved.rawCode) {
    if (saved.role === "a" && saved.core) restoreHost(saved);
    else if (saved.role === "b") startGuest(saved.rawCode, saved.view || null);
  }
})();
</script>
</body>
</html>
