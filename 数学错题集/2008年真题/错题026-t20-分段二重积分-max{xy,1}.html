<div class="tags"><span class="tag-type">错误类型：方法选择</span><span class="tag-status">状态：需重做</span><span class="tag-chapter">章节：2008年真题</span></div>

﻿<p><b>考点</b>：分段二重积分 max{xy,1} 在D=[0,2]×[0,2]上</p>
<p><b>方法</b>：xy=1为分界线，D分成xy≥1和xy<1两块，分别积分。注意xy<1区域不能直接套公式，要拆成矩形减xy≥1部分。</p>
<p><b>错因</b>：不会处理max函数分段；积分区域划分错误。</p>
<p><b>复习</b>：回顾分段被积函数二重积分的"划分区域+分别积分"套路。</p>
